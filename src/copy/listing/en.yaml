apply:
  tagline: 'Application'
  title: 'Viewing & Application'
  body: |
    Please [send a complete application by email]({{email}}) (ID, proof of income and of employment status).\
    Applications will be shortlisted before a first round of viewings is arranged.

    **A guarantor may be requested depending on the strength of the application.**

    To put together a complete application, please refer to the information on [service-public.fr — Rental application (Tenant section)](https://www.service-public.fr/particuliers/vosdroits/F1169) (in French).

faq:
  tagline: 'Frequently asked questions'
  title: 'FAQ'
  intro: 'More questions? [Feel free to contact us by email!]({{email}})'
  items:
    visit:
      question: 'Can I view the property before applying?'
      answer: 'Viewings will be arranged for a shortlist of complete applications. Please send us your application by email to be considered.'
    criteria:
      question: 'How are applications selected?'
      answer: 'We are looking for reliable tenants with a stable income sufficient to cover the rent. A guarantor may be requested depending on the strength of the application.'
    availability:
      question: 'Is the home available immediately?'
      answer: 'The home will be available from April 2026. We are accepting applications now so that future tenants can prepare their file in advance.'
    agency:
      question: 'Are there any agency fees?'
      answer: 'No, there are no agency fees. You can apply directly by sending your complete application by email.'
    furnished:
      question: 'Is the home furnished?'
      answer: 'Yes, the home is fully furnished and equipped, ready to welcome its future tenants.'
    parking:
      question: 'Is a parking space included?'
      answer: 'Yes, a parking space is included with the home, for extra convenience.'
    deposit:
      question: 'How much is the security deposit?'
      answer: 'The security deposit is two months’ rent excluding charges, in line with the rules for furnished rentals. It is due when the lease is signed.'
    charges:
      question: 'Are charges included in the rent?'
      answer: 'Yes, the €1,500 rent includes charges. It is a monthly advance covering the building’s service charges. An annual adjustment may be made if needed.'
    lease:
      question: 'How long is the lease?'
      answer: 'The furnished lease runs for one year and renews automatically. Termination follows the regulations in force.'
    insurance:
      question: 'Is home insurance compulsory?'
      answer: 'Yes, home insurance covering at least tenant liability is compulsory. A certificate must be provided when moving in.'

