apply:
  tagline: 'Candidature'
  title: 'Visite & Candidature'
  body: |
    Merci [d'envoyer un dossier complet par email]({{email}}) (pièce d'identité, justificatifs de ressources et de situation professionnelle).\
    Une sélection des dossiers sera effectuée avant l'organisation d'une première ronde de visites.

    **Un garant pourra être demandé selon la solidité du dossier.**

    Pour constituer un dossier complet, veuillez vous référer aux informations disponibles sur [service-public.fr — Dossier de location (section Locataire)](https://www.service-public.fr/particuliers/vosdroits/F1169).

faq:
  tagline: 'Questions fréquentes'
  title: 'FAQ'
  intro: "Des questions supplémentaires ? [N'hésitez pas à nous contacter par email !]({{email}})"
  items:
    visit:
      question: 'Puis-je visiter le bien avant de postuler ?'
      answer: 'Des visites seront organisées pour une sélection de dossiers complets. Merci de nous envoyer votre dossier de candidature par email pour être considéré.e.'
    criteria:
      question: 'Quels sont les critères de sélection des dossiers ?'
      answer: 'Nous recherchons des locataires sérieux, avec des ressources stables et suffisantes pour couvrir le loyer. Un garant pourra être demandé selon la solidité du dossier.'
    availability:
      question: 'Le logement est-il disponible immédiatement ?'
      answer: "Le logement sera disponible à partir d'avril 2026. Nous acceptons les candidatures dès maintenant pour permettre aux futurs locataires de préparer leur dossier en amont."
    agency:
      question: "Y a-t-il des frais d'agence ?"
      answer: "Non, il n'y a pas de frais d'agence. Vous pouvez postuler directement en envoyant votre dossier complet par email."
    furnished:
      question: 'Le logement est-il meublé ?'
      answer: 'Oui, le logement est entièrement meublé et équipé, prêt à accueillir ses futurs locataires.'
    parking:
      question: 'Y a-t-il une place de parking incluse ?'
      answer: 'Oui, une place de parking est incluse avec le logement, offrant un confort supplémentaire pour les locataires.'
    deposit:
      question: 'Quel est le montant du dépôt de garantie ?'
      answer: 'Le dépôt de garantie est de deux mois de loyer hors charges, conformément à la réglementation pour les locations meublées. Il est dû à la signature du bail.'
    charges:
      question: 'Les charges sont-elles incluses dans le loyer ?'
      answer: "Oui, le loyer de 1500 € est charges comprises. Il s'agit d'une provision mensuelle couvrant les charges de copropriété. Une régularisation annuelle peut être effectuée si nécessaire."
    lease:
      question: 'Quelle est la durée du bail pour ce logement ?'
      answer: "Le bail meublé est conclu pour une durée d'un an, renouvelable automatiquement. Les conditions de résiliation suivent la réglementation en vigueur."
    insurance:
      question: "L'assurance habitation est-elle obligatoire ?"
      answer: 'Oui, une assurance habitation couvrant au minimum les risques locatifs est obligatoire. Une attestation devra être fournie à l’entrée dans les lieux.'

